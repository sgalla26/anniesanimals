<div class="page-wrapper">

    <div class="split-container">

        <div class="split-column" id="gallery-section">

            <h3>Pet Photo Gallery</h3>
            <p>View shared pet photos below or upload your own!</p>

            <form id="uploadForm">
                <label>Upload a Pet Photo:</label>
                <input type="file" id="imageUpload" accept="image/*">
                <button type="submit">Add to Gallery</button>
            </form>

            

            <h4>Gallery</h4>

            <!-- Container for JavaScript to populate once user adds an image -->
            <div id="galleryGrid" class="gallery">

        <div class="split-column" id="reviews-section">

            <h3>Customer Reviews</h3>
            <p>Read what others are saying or leave your own review.</p>

            <form id="reviewForm">

                <div class="form-row">
                    <label for="reviewer">Your Name:</label>
                    <input type="text" id="reviewer" name="reviewer" required>
                </div>

                <div class="form-row">
                    <label for="reviewText">Your Review:</label>
                    <textarea id="reviewText" name="reviewText" required minlength="10"></textarea>
                </div>

                <div class="form-row">
                    <label for="rating">Rating (1-5):</label>
                    <select id="rating" name="rating" required>
                        <option value="">Select</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>
                </div>

                <button type="submit">Post Review</button>

            </form>

            <h4>Current Reviews</h4>
        
            <!-- Container for JavaScript to populate when user submits a reivew -->
            <div id="reviewsContainer">
